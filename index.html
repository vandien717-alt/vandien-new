<style>
/* Layout concept: Văn Diễn / VD SOLUTIONS brand site built from the logo. A slanted-tile mosaic (the logo's pixel cluster) in the hero, row-based lists, one sticky band holding header and VnExpress ticker. */
:root{
  --bg:#F4F7F2; --surface:#FFFFFF; --fg:#0E1612; --muted:#46534B; --line:#D5DDD5;
  --red:#E3000F; --yellow:#FDC102; --green:#07883A;
  --on-red:#FFFFFF; --on-green:#FFFFFF; --on-yellow:#14110A;
  --link:#B8000C; --ring:#07883A;
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B110E; --surface:#131B17; --fg:#EDF2EC; --muted:#A5B2AA; --line:#25312B;
    --link:#FF6A72; --ring:#3DDC84; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B110E; --surface:#131B17; --fg:#EDF2EC; --muted:#A5B2AA; --line:#25312B;
  --link:#FF6A72; --ring:#3DDC84; color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.65 var(--f-body);margin:0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(2.35rem,6.2vw,4.5rem);line-height:1.03}
h2{font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.1}
h3{font-size:1.25rem;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
.wrap{width:100%;max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow,.tag{font-family:var(--f-mono);font-size:.74rem;line-height:1.5;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lead{font-size:clamp(1.05rem,1.6vw,1.2rem);color:var(--muted);max-width:60ch}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

/* sticky band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
.bar{display:flex;align-items:center;gap:16px;min-height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{height:40px;width:auto;display:block}
.brand-txt{display:flex;flex-direction:column;line-height:1}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:-.03em;line-height:1.05}
.brand-sub{font:500 .62rem var(--f-mono);letter-spacing:.16em;color:var(--muted);margin-top:4px}
nav{margin-left:auto}
nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:9px 9px;text-decoration:none;font-size:.9rem;white-space:nowrap;font-weight:500;color:var(--muted);box-shadow:inset 0 -2px 0 transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--red)}
.bar-right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1.5px solid var(--fg);border-radius:6px;overflow:hidden}
.lang button{font:500 .78rem var(--f-mono);letter-spacing:.06em;padding:7px 10px;border:0;background:transparent;color:var(--fg);cursor:pointer;min-width:38px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.burger{display:none;width:42px;height:42px;border:1.5px solid var(--fg);border-radius:6px;background:transparent;color:var(--fg);cursor:pointer;padding:0;align-items:center;justify-content:center}
.burger i{display:block;width:18px;height:2px;background:currentColor;position:relative}
.burger i::before,.burger i::after{content:"";position:absolute;left:0;width:18px;height:2px;background:currentColor}
.burger i::before{top:-6px}.burger i::after{top:6px}

/* ticker */
.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.ticker .wrap{display:flex;align-items:center;height:40px;gap:12px}
.tk-label{flex:none;display:flex;align-items:center;height:26px;padding:0 10px;background:var(--red);color:var(--on-red);font:500 .7rem var(--f-mono);letter-spacing:.09em;text-transform:uppercase;text-decoration:none;transform:skewX(-12deg)}
.tk-label span{display:block;transform:skewX(12deg)}
.tk-view{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.tk-track{display:flex;width:max-content;animation:tk 80s linear infinite}
.tk-track:hover{animation-play-state:paused}
.tk-track a{white-space:nowrap;font-size:.86rem;text-decoration:none;padding:8px 34px 8px 0;color:var(--fg)}
.tk-track a:hover{text-decoration:underline}
.tk-track a b{font-weight:600;color:var(--link);margin-right:6px}
@keyframes tk{to{transform:translateX(-50%)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:6px;font:600 .98rem var(--f-body);text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-ghost{border-color:var(--fg);color:var(--fg);background:transparent}
.btn-yellow{background:var(--yellow);color:var(--on-yellow)}
.btn-sm{min-height:40px;padding:0 15px;font-size:.9rem}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(28px,5vw,68px);align-items:center;padding-block:clamp(34px,6vw,84px)}
.hero-copy{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.hero-note{font-size:.92rem;color:var(--muted)}
.hero-note b{color:var(--fg);font-weight:600}
.mosaic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"a a b" "c d d" "e f g";gap:10px;padding:10px 20px}
.tile{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:122px;padding:14px 22px;text-decoration:none;transform:skewX(-12deg);transition:transform .2s;animation:rise .6s both}
.tile>*{transform:skewX(12deg);display:block}
.tile:hover{transform:skewX(-12deg) translateY(-5px)}
.tile b{font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.15}
.tile span{font-size:.78rem;line-height:1.35}
.tile:nth-child(1){grid-area:a;animation-delay:.05s}.tile:nth-child(2){grid-area:b;animation-delay:.12s}.tile:nth-child(3){grid-area:c;animation-delay:.19s}.tile:nth-child(4){grid-area:d;animation-delay:.26s}.tile:nth-child(5){grid-area:e;animation-delay:.33s}.tile:nth-child(6){grid-area:f;animation-delay:.4s}.tile:nth-child(7){grid-area:g;animation-delay:.47s}
.t-red{background:var(--red);color:var(--on-red)}
.t-green{background:var(--green);color:var(--on-green)}
.t-yellow{background:var(--yellow);color:var(--on-yellow)}
.t-ink{background:var(--fg);color:var(--bg)}
@keyframes rise{from{transform:skewX(-12deg) translateY(14px)}to{transform:skewX(-12deg) translateY(0)}}

/* sections */
.sec{padding-block:clamp(44px,7vw,92px)}
.sec-head{display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(24px,4vw,40px);max-width:760px}
.phead{padding-block:clamp(34px,6vw,76px) 12px}
.phead h1{font-size:clamp(2.1rem,5.2vw,3.5rem);margin-top:12px;max-width:20ch}
.phead .lead{margin-top:18px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr) auto;gap:14px 36px;padding-block:28px;border-bottom:1px solid var(--line);align-items:start}
.row-main{display:flex;flex-direction:column;gap:8px}
.row-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.row-body p{color:var(--muted);max-width:62ch}
.row .go{align-self:center;font-weight:600;color:var(--link);text-decoration:none;white-space:nowrap}
.row .go:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.88rem;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ticks li{position:relative;padding-left:24px;font-size:.96rem}
.ticks li::before{content:"";position:absolute;left:2px;top:.5em;width:10px;height:10px;background:var(--red);transform:skewX(-14deg)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:4px solid var(--c,var(--red))}
.steps li:nth-child(2){--c:var(--yellow)}.steps li:nth-child(3){--c:var(--green)}.steps li:nth-child(4){--c:var(--fg)}
.steps .n{font:500 .85rem var(--f-mono);color:var(--muted)}
.steps p{color:var(--muted);font-size:.95rem}
.band{background:var(--fg);color:var(--bg)}
.band .eyebrow{color:var(--bg)}
.band-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(24px,5vw,64px);align-items:start}
.band-grid .lead{color:var(--bg)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{padding-block:16px;border-top:1px solid color-mix(in srgb,var(--bg) 30%,transparent)}
.rules li:last-child{border-bottom:1px solid color-mix(in srgb,var(--bg) 30%,transparent)}
.rules b{display:block;font-family:var(--f-display);font-size:1.1rem;margin-bottom:2px}
.cta-block{border:1.5px solid var(--fg);padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px 40px;align-items:center;background:var(--surface)}
.cta-block .cta-row{justify-content:flex-start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,36px)}
.box{background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:10px}
.box p{color:var(--muted);font-size:.96rem}
details{border-top:1px solid var(--line);padding-block:16px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--link)}
details[open] summary::after{content:"−"}
details p{margin-top:10px;color:var(--muted);max-width:66ch}

/* news */
.news-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.news-list li{border-bottom:1px solid var(--line)}
.news-list a{display:flex;justify-content:space-between;gap:20px;padding-block:16px;text-decoration:none}
.news-list a:hover strong{text-decoration:underline}
.news-list strong{font-weight:600}
.news-list span{color:var(--muted);font-size:.9rem;display:block;margin-top:2px}
.news-list em{font-style:normal;color:var(--link);font-weight:600;white-space:nowrap}
.note{font-size:.88rem;color:var(--muted);max-width:70ch}

/* form */
.contact{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;padding-bottom:clamp(40px,6vw,80px)}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full,.check,.form-foot{grid-column:1/-1}
label{font-weight:600;font-size:.92rem}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
textarea{resize:vertical;min-height:130px}
[aria-invalid="true"]{border-color:var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.92rem;color:var(--muted)}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
.check a{color:var(--link)}
.err{color:var(--link);font-weight:600;font-size:.92rem;min-height:1.4em}
.form-foot{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.result{background:var(--surface);border:1.5px solid var(--green);padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:16px}
.result pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 .9rem/1.6 var(--f-mono);background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:6px}
.aside{display:flex;flex-direction:column;gap:20px;position:sticky;top:150px}
.zalo-card{background:var(--green);color:var(--on-green);padding:24px;display:flex;flex-direction:column;gap:12px}
.zalo-card .num{font:700 1.7rem var(--f-display);letter-spacing:.01em}
.zalo-card .btn{background:var(--yellow);color:var(--on-yellow)}
.zalo-card .btn-copy{background:transparent;color:var(--on-green);border-color:var(--on-green)}


.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.pcat{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c,var(--red));padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pcat .go{margin-top:auto;font-weight:600;color:var(--link);text-decoration:none}
.pcat .go:hover{text-decoration:underline}
.linklist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.linklist li{border-bottom:1px solid var(--line)}
.linklist a{display:block;padding:11px 2px;text-decoration:none;font-weight:500}
.linklist a:hover{color:var(--link);text-decoration:underline}
.crumb{color:var(--link);font-weight:600;text-decoration:none}
.crumb:hover{text-decoration:underline}
.info{margin:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line)}
.info div{padding:12px 18px;border-bottom:1px solid var(--line)}
.info div:last-child{border-bottom:0}
.info dt{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.info dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
/* footer */
footer{border-top:1px solid var(--line);padding-block:48px 160px;background:var(--surface)}
.foot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:32px}
.foot ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.foot a{text-decoration:none;color:var(--muted)}
.foot a:hover{color:var(--fg);text-decoration:underline}
.foot img{height:52px;width:auto;display:block;margin-bottom:12px}
.legal{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}

/* zalo floating */
.zalo{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 20px 0 16px;border-radius:999px;background:var(--green);color:var(--on-green);text-decoration:none;font:600 .98rem var(--f-body);box-shadow:0 6px 22px rgba(0,0,0,.28);border:2px solid #fff}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.call{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 20px 0 16px;border-radius:999px;background:var(--red);color:var(--on-red);text-decoration:none;font:600 .98rem var(--f-body);box-shadow:0 6px 22px rgba(0,0,0,.28);border:2px solid #fff}
.call:hover{transform:translateY(-2px)}
.call svg,.zalo svg{flex:none}
.zalo::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid var(--green);animation:ping 2.4s ease-out infinite;pointer-events:none}
.zalo:hover{transform:translateY(-2px)}
@keyframes ping{0%{transform:scale(.96);opacity:.7}80%,100%{transform:scale(1.18);opacity:0}}

@media (max-width:1020px){
  .burger{display:inline-flex}
  nav{position:absolute;left:0;right:0;top:100%;margin:0;background:var(--bg);border-bottom:1px solid var(--line);display:none;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  nav.open{display:block}
  nav ul{flex-direction:column}
  nav a{padding:13px 4px;font-size:1.02rem;box-shadow:none;border-bottom:1px solid var(--line)}
  nav a[aria-current="page"]{box-shadow:none;color:var(--link)}
  .bar{position:relative}
  .bar-right{margin-left:auto}
  .hide-sm{display:none}
}
@media (max-width:900px){
  .hero,.band-grid,.cta-block,.contact{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
  .foot{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .foot>:first-child{grid-column:1/-1}
}
@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  form{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .brand-name{font-size:1.25rem}
  .brand img{height:34px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .mosaic{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"a a" "b c" "d d" "e f" "g g";padding-inline:16px}
  .tile{min-height:104px}
  .tile span{font-size:.74rem}
  .zalo span{font-size:.92rem}
  .foot{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .tk-track{animation:none}
  .tk-view{overflow-x:auto}
  .tk-dup{display:none}
  .tile,.zalo::after{animation:none}
  .zalo::after{display:none}
  .btn,.tile,.zalo{transition:none}
}
</style>
</head>

function fieldHtml(kind,f){
  var id="f-"+f.n,lab=L(f.vi,f.en)+(f.req?" *":"");
  var cls="field"+(f.full?" full":"");
  var ctl;
  if(f.type==="textarea")ctl='<textarea id="'+id+'" name="'+f.n+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'></textarea>';
  else if(f.type==="select"){
    var sel=(f.n==="service"&&pendingService)?pendingService:"";
    ctl='<select id="'+id+'" name="'+f.n+'">'+f.opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===sel&&sel?' selected':'')+'>'+esc(lang==="vi"?o[1]:o[2])+'</option>';}).join("")+'</select>';
  } else {
    var val=(f.n==="product"&&pendingProduct)?pendingProduct:"";
    ctl='<input id="'+id+'" name="'+f.n+'" type="'+(f.type||"text")+'"'+(f.type==="tel"?' inputmode="tel"':'')+(f.ac?' autocomplete="'+f.ac+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(val?' value="'+esc(val)+'"':'')+'>';
  }
  return '<div class="'+cls+'"><label for="'+id+'">'+lab+'</label>'+ctl+'</div>';
}
function formHtml(kind){
  var d=formDef(kind);
  var h='<div id="leadBox"><form id="leadForm" data-kind="'+kind+'" novalidate>'+d.fields.map(function(f){return fieldHtml(kind,f);}).join("")+

  pendingService="";pendingProduct="";

}

function renderPage(){
  var r=route(),sv=svcByRoute(r);
  $("#main").innerHTML=sv?servicePage(sv):PAGES[r]();
  var cur=sv?"services":r;
  var els=document.querySelectorAll("[data-nav]");
  for(var i=0;i<els.length;i++){if(els[i].getAttribute("data-nav")===cur)els[i].setAttribute("aria-current","page");else els[i].removeAttribute("aria-current");}
  var nav=$("#nav");if(nav)nav.classList.remove("open");
  var b=$("#burger");if(b)b.setAttribute("aria-expanded","false");
  var sev=sv?T(sv.n):(navItems().filter(function(n){return n[0]===r;})[0]||[0,"VD SOLUTIONS"])[1];
  document.title=(r==="home"?"Văn Diễn":sev+" | Văn Diễn");
}
function go(){renderPage();window.scrollTo(0,0);}

/* ---------- interactions ---------- */
function selectNode(el){try{var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}
function copy(text,node,btn){
  var done=function(msg){var o=btn.getAttribute("data-o")||btn.textContent;btn.setAttribute("data-o",o);btn.textContent=msg;setTimeout(function(){btn.textContent=o;},2000);};
  var fallback=function(){selectNode(node);done(L("Hãy chép thủ công","Select and copy"));};
  try{navigator.clipboard.writeText(text).then(function(){done(L("Đã chép","Copied"));},fallback);}catch(e){fallback();}
}
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-lang],[data-service],[data-product],#burger,[data-copy],#lead-copy,#lead-reset,#nav a"):null;
  if(!t)return;
  if(t.hasAttribute("data-lang")){lang=t.getAttribute("data-lang");try{localStorage.setItem("vd-lang",lang);}catch(x){}chrome();renderPage();return;}
  if(t.id==="burger"){var n=$("#nav");var o=n.classList.toggle("open");t.setAttribute("aria-expanded",String(o));return;}
  if(t.hasAttribute("data-copy")){var el=document.getElementById(t.getAttribute("data-copy"));copy(el.textContent,el,t);return;}
  if(t.id==="lead-copy"){var pre=$("#leadText");copy(pre.textContent,pre,t);return;}
  if(t.id==="lead-reset"){go();return;}
  if(t.hasAttribute("data-service")||t.hasAttribute("data-product")){
    pendingService=t.getAttribute("data-service")||"";pendingProduct=t.getAttribute("data-product")||"";
    var target=(t.getAttribute("href")||"").replace("#","");
    if(route()===target){e.preventDefault();go();}
    return;
  }
  if(t.closest("#nav")){var nv=$("#nav");nv.classList.remove("open");var bb=$("#burger");if(bb)bb.setAttribute("aria-expanded","false");}
});

document.addEventListener("submit",function(e){
  if(e.target.id!=="leadForm")return;
  e.preventDefault();
  var f=e.target,kind=f.getAttribute("data-kind"),def=formDef(kind);
  var all=f.querySelectorAll("[aria-invalid]");for(var i=0;i<all.length;i++)all[i].removeAttribute("aria-invalid");
  var err=function(el,msg){el.setAttribute("aria-invalid","true");$("#formErr").textContent=msg;el.focus();};
  var vals={};
  for(var k=0;k<def.fields.length;k++){
    var fd=def.fields[k],el=f.elements[fd.n],v=el.value.trim();
    vals[fd.n]=v;
    if(fd.req&&!v){err(el,L("Vui lòng điền: ","Please fill in: ")+L(fd.vi,fd.en)+".");return;}
    if(fd.min&&v.length<fd.min){err(el,L("Hãy mô tả ít nhất 10 ký tự.","Please write at least 10 characters."));return;}
    if(fd.type==="tel"&&!/^(\+?84|0)\d{9,10}$/.test(v.replace(/[\s.\-]/g,""))){err(el,L("Số điện thoại chưa đúng. Ví dụ: 0354830717.","That phone number looks wrong. Example: 0354830717."));return;}
    if(fd.type==="email"&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){err(el,L("Email chưa đúng định dạng.","That email address looks wrong."));return;}
  }
  if(!f.elements.consent.checked){err(f.elements.consent,L("Vui lòng đồng ý để Văn Diễn liên hệ với bạn.","Please agree to let Văn Diễn contact you."));return;}
  $("#formErr").textContent="";
  var lines=["[VD SOLUTIONS] "+def.label];
  var payload={kind:kind,lang:lang,time:new Date().toISOString()};
  def.fields.forEach(function(fd){
    var v=vals[fd.n];if(!v&&!fd.req)return;
    var shown=v;
    if(fd.type==="select"){var o=fd.opts.filter(function(x){return x[0]===v;})[0];shown=o?o[1]:v;}
    lines.push(fd.vi+": "+shown);payload[fd.n]=shown;
  });
  var text=lines.join("\n");
  var btn=f.querySelector("button[type=submit]");btn.disabled=true;
  var finish=function(sent){
    var box=$("#leadBox");
    box.innerHTML='<div class="result" role="status"><h2 style="font-size:1.6rem">'+(sent?L("Văn Diễn đã nhận yêu cầu của bạn","Văn Diễn has received your request"):L("Bước cuối: gửi yêu cầu cho Văn Diễn","Last step: send your request to Văn Diễn"))+'</h2>'+
      '<p style="color:var(--muted)">'+(sent?L("Văn Diễn sẽ liên hệ lại với bạn. Nếu cần nhanh hơn, bạn có thể gửi email.","Văn Diễn will get back to you. If you need it sooner, you can send an email."):L("Yêu cầu của bạn đã được soạn sẵn bên dưới. Nhấn Chép nội dung, rồi dán vào email hoặc Zalo. Yêu cầu chỉ đến Văn Diễn sau khi bạn gửi.","Your request is drafted below. Tap Copy text, then paste it into an email or Zalo. Văn Diễn only receives it once you send it."))+'</p>'+
      '<pre id="leadText">'+esc(text)+'</pre><div class="cta-row"><button class="btn btn-ghost" type="button" id="lead-copy">'+L("Chép nội dung","Copy text")+'</button><a class="btn btn-red" href="mailto:'+EMAIL+'?subject='+encodeURIComponent(lines[0])+'&body='+encodeURIComponent(text)+'">'+L("Gửi qua email","Send by email")+'</a><button class="btn btn-ghost" type="button" id="lead-reset">'+L("Soạn yêu cầu khác","New request")+'</button></div></div>';
    box.scrollIntoView({block:"start"});
  };
  if(FORM_ENDPOINT){
    fetch(FORM_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(function(){finish(true);},function(){finish(false);});
  } else finish(false);
});

window.addEventListener("hashchange",go);

/* live headlines: only works when the page is hosted where outside requests are allowed */
function loadNews(){
  try{
    var ctl=new AbortController();var tm=setTimeout(function(){ctl.abort();},6000);
    fetch(NEWS_FEED,{signal:ctl.signal}).then(function(r){clearTimeout(tm);if(!r.ok)throw 0;return r.json();}).then(function(j){
      var items=(j.items||[]).map(function(i){return {t:String(i.title||""),u:String(i.link||"")};}).filter(function(i){return i.t&&/^https:\/\/(e\.)?vnexpress\.net\//.test(i.u);}).slice(0,12);
      if(items.length){news.items=items;news.live=true;renderTicker();if(route()==="news")renderPage();}
    }).catch(function(){});
  }catch(e){}
}
chrome();renderPage();loadNews();
})();
